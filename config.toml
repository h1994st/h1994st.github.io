author = "Shengtuo Hu"
base_url = "https://shengtuo.me"
description = "Shengtuo Hu (nu1lptr), security researcher. Writing on program analysis, LLVM, fuzzing and network security."
title = "nu1lptr"

build_search_index = true
feed_filenames = ["rss.xml", "atom.xml"]
generate_feeds = true
# Off: the minifier drops attribute quotes, and tools/check-site matches the
# quoted form (rel="canonical", http-equiv="refresh", ld+json script tags).
minify_html = false

taxonomies = [{ name = "tags", feed = true }]

# Only facet's built files are published; its sources, tests and mockups stay out.
# In Zola's globs `*` also matches `/`, so "[!d]*" drops every top-level entry
# of the submodule (and everything under it) except dist/, and docs/ goes by
# name. A directory is only skipped when the directory itself matches.
ignored_static = [
  "vendor/facet/[!d]*",
  "vendor/facet/docs",
  "vendor/facet/docs/**",
]

[search]
index_format = "fuse_json"
include_description = true

[markdown]
github_alerts = true
insert_anchor_links = "left"

external_links_target_blank = true

[markdown.highlighting]
# Fence options (name=, wrap=, ...) land on <pre> too, where facet reads titles.
data_attr_position = "both"
style = "class"
theme = "material-theme"

# Who: copyright, <title>, hero, JSON-LD Person.
[extra.author]
name = "Shengtuo Hu"
handle = "nu1lptr"
role = "Security researcher"
works_for = { name = "Palo Alto Networks", url = "https://www.paloaltonetworks.com/" }
alumni_of = [
  { name = "University of Michigan", url = "https://umich.edu/" },
  { name = "Tongji University", url = "https://en.tongji.edu.cn/" },
]
knows_about = [
  "Program analysis",
  "LLVM",
  "Fuzzing",
  "Network security",
  "Connected and autonomous vehicle security",
]

# One list: the footer and hero social rows AND the JSON-LD sameAs, which ties
# this site to the external profiles that outrank it for "Shengtuo Hu".
# `icon` is a facet icon name; `show = false` keeps a profile in sameAs only.
[[extra.profiles]]
name = "GitHub"
url = "https://github.com/h1994st"
icon = "github"

[[extra.profiles]]
name = "Google Scholar"
url = "https://scholar.google.com/citations?user=VOefXMMAAAAJ"
icon = "google-scholar"

[[extra.profiles]]
name = "LinkedIn"
url = "https://www.linkedin.com/in/shengtuo/"
icon = "linkedin"

[[extra.profiles]]
name = "X"
url = "https://x.com/ShengtuoHu"
icon = "x"

[[extra.profiles]]
name = "Instagram"
url = "https://www.instagram.com/hst_nullderef/"
icon = "instagram"

[[extra.profiles]]
name = "DBLP"
url = "https://dblp.org/pid/203/0829.html"
icon = "dblp"
show = false

# Site-wide settings.
[extra.site]
home_title = "Shengtuo Hu - Security Researcher"
twitter = "@ShengtuoHu"
accent = "moss"                     # <html data-accent>
facet = "/vendor/facet/dist"        # where facet's files are served from
ga4 = "G-ZMH6NLL7C7"                # <html data-f-ga4>, read by facet's analytics.js

# On/off switches for the kept extras.
[extra.features]
search = true
code_copy = true
reading_time = true
share = true
backlinks = true
footer_cats = true
toc = "sidebar"                     # default for posts: "sidebar", "inline" or false
# Code blocks (facet's data-f-code-*): a page's [extra] overrides these, and a fence's ln=, wrap=
# or frame= (e.g. ```txt,wrap=false) overrides the page. name=… gives a block a title.
code_line_numbers = true
code_wrap = true
code_frame = false                  # the terminal-style title bar

[extra.nav]
links = [
  { url = "@/blog/_index.md", name = "Blog" },
  { url = "@/projects/index.md", name = "Projects" },
  { url = "@/resume/index.md", name = "Resume" },
]

[extra.footer]
links = [
  { url = "@/blog/_index.md", name = "Blog" },
  { url = "@/notebook/_index.md", name = "Notebook" },
  { url = "@/misc/index.md", name = "Misc." },
]
