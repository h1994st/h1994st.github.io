  <path class="core white" d="M452 124H560"/>
  <path class="photon white" d="M452 124H560"/>
  <path class="glow red" d="M624 124H680"/>
  <path class="core red" d="M624 124H680"/>
  <path class="photon red" d="M624 124H680"/>
  <path class="glow blue" d="M592 156V254"/>
  <path class="core blue" d="M592 156V254"/>
  <path class="photon blue" d="M592 156V254"/>
  <path class="glow green" d="M560 286H452"/>
  <path class="core green" d="M560 286H452"/>
  <path class="photon green" d="M560 286H452"/>
  <path class="glow green" d="M420 254V156"/>
  <path class="core green" d="M420 254V156"/>
  <path class="photon green" d="M420 254V156"/>
  <text class="name" x="76" y="50" text-anchor="middle">Chromatron.app</text>
  <text class="sub" x="76" y="68" text-anchor="middle">PowerPC, 2003</text>
  <text class="name" x="248" y="50" text-anchor="middle">Ghidra</text>
  <text class="sub" x="248" y="68" text-anchor="middle">decompiles it</text>
  <text class="name" x="420" y="50" text-anchor="middle">Claude Code</text>
  <text class="sub" x="420" y="68" text-anchor="middle">reads it, writes Rust</text>
  <text class="name" x="592" y="50" text-anchor="middle">Rust engine</text>
  <text class="sub" x="592" y="68" text-anchor="middle">one for all four</text>
  <text class="name" x="712" y="50" text-anchor="middle">4 Mac apps</text>
  <text class="sub" x="712" y="68" text-anchor="middle">Apple Silicon</text>
