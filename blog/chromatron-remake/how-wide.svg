  <rect class="icon" x="64" y="109" width="24" height="30" rx="3.5"/>
  <rect class="icon" x="68" y="113" width="16" height="12" rx="1.5"/>
  <path class="icon" d="M77 132H83"/>
  <circle class="spark twinkle" cx="71" cy="132" r="1.6"/>
  <rect class="tile" x="216.0" y="92.0" width="64" height="64" rx="14"/>
  <circle class="icon" cx="245" cy="121" r="10"/>
  <path class="icon" d="M252.5 128.5L261 137" stroke-width="3"/>
  <text class="icon-fill" x="245" y="124.5" text-anchor="middle" font-size="8.5" font-weight="800" font-family="ui-monospace, Menlo, monospace">01</text>
  <rect class="tile" x="388.0" y="92.0" width="64" height="64" rx="14"/>
  <rect class="icon" x="405" y="113" width="30" height="23" rx="3.5"/>
  <path class="icon" d="M411 121L416 125.5L411 130M419 130H426"/>
  <path class="spark twinkle" d="M434 102l2.2 5.3 5.3 2.2-5.3 2.2-2.2 5.3-2.2-5.3-5.3-2.2 5.3-2.2z"/>
  <rect class="tile" x="560.0" y="92.0" width="64" height="64" rx="14"/>
  <path class="icon" d="M592 109L607 135H577Z" stroke-width="2"/>
  <path class="icon" d="M589 118L597 132" stroke-opacity=".35"/>
  <rect class="tile" x="680.0" y="92.0" width="64" height="64" rx="14"/>
  <circle class="glow red halo" cx="712" cy="124" r="10"/>
  <circle class="ring red" cx="712" cy="124" r="10"/>
  <circle class="red" cx="712" cy="124" r="3.5" style="fill: var(--red); stroke: none"/>
  <path class="rays red" d="M727 124L732 124M697 124L692 124M712 139L712 144M712 109L712 104M722.65 134.65L726.2 138.2M701.35 134.65L697.8 138.2M722.65 113.35L726.2 109.8M701.35 113.35L697.8 109.8"/>
