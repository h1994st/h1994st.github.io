  <text class="sub" x="592" y="360" text-anchor="middle">phones too</text>
  <text class="name" x="420" y="342" text-anchor="middle">Me</text>
  <text class="sub" x="420" y="360" text-anchor="middle">playing it</text>
  <path class="core white" d="M40 262H64"/>
  <text class="key" x="74" y="266">white light: the original game</text>
  <path class="core red" d="M40 286H50"/>
  <path class="core blue" d="M54 286H64"/>
