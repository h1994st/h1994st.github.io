  <circle class="icon-fill" cx="320" cy="521.5" r="1.9"/>
  <text class="name" x="60" y="576" text-anchor="middle">4 Mac apps</text>
  <text class="sub" x="60" y="594" text-anchor="middle">Apple Silicon</text>
  <text class="name" x="200" y="576" text-anchor="middle">Browser</text>
  <text class="sub" x="200" y="594" text-anchor="middle">phones too</text>
  <text class="name" x="310" y="576" text-anchor="middle">Me</text>
  <text class="sub" x="310" y="594" text-anchor="middle">playing it</text>
  <path class="core white" d="M24 630H48"/>
  <text class="key" x="58" y="634">white light: the original game</text>
  <path class="core red" d="M24 654H34"/>
  <path class="core blue" d="M38 654H48"/>
  <text class="key" x="58" y="658">red and blue: what came out</text>
  <path class="core green" d="M24 678H48"/>
  <text class="key" x="58" y="682">green: me, playing and reporting back</text>
</svg>
