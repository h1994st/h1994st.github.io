  <rect class="tile" x="278.0" y="488.0" width="64" height="64" rx="14"/>
  <path class="icon" d="M299 511H321a7 7 0 0 1 7 6.5l1 7.5a4.5 4.5 0 0 1-8 3.2l-3.2-3.7H301.8l-3.2 3.7a4.5 4.5 0 0 1-8-3.2l1-7.5A7 7 0 0 1 299 511Z"/>
  <path class="icon" d="M299 519h7M302.5 515.5v7"/>
