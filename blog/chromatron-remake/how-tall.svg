  <path class="core white" d="M60 312V358"/>
  <path class="photon white" d="M60 312V358"/>
  <path class="glow red" d="M52 422V488"/>
  <path class="core red" d="M52 422V488"/>
  <path class="photon red" d="M52 422V488"/>
  <path class="glow blue" d="M72 422V452H200V488"/>
  <path class="core blue" d="M72 422V452H200V488"/>
  <path class="photon blue" d="M72 422V452H200V488"/>
  <path class="glow green" d="M232 520H278"/>
  <path class="core green" d="M232 520H278"/>
  <path class="photon green" d="M232 520H278"/>
  <path class="glow green" d="M310 488V236H84V248"/>
  <path class="core green" d="M310 488V236H84V248"/>
  <path class="photon green" d="M310 488V236H84V248"/>
  <rect class="tile" x="28.0" y="28.0" width="64" height="64" rx="14"/>
  <rect class="icon" x="48" y="45" width="24" height="30" rx="3.5"/>
  <rect class="icon" x="52" y="49" width="16" height="12" rx="1.5"/>
  <path class="icon" d="M61 68H67"/>
  <circle class="spark twinkle" cx="55" cy="68" r="1.6"/>
  <text class="name" x="104" y="58" text-anchor="start">Chromatron.app</text>
  <text class="sub" x="104" y="76" text-anchor="start">PowerPC, 2003</text>
  <rect class="tile" x="28.0" y="138.0" width="64" height="64" rx="14"/>
  <circle class="icon" cx="57" cy="167" r="10"/>
  <path class="icon" d="M64.5 174.5L73 183" stroke-width="3"/>
  <text class="icon-fill" x="57" y="170.5" text-anchor="middle" font-size="8.5" font-weight="800" font-family="ui-monospace, Menlo, monospace">01</text>
  <text class="name" x="104" y="168" text-anchor="start">Ghidra</text>
  <text class="sub" x="104" y="186" text-anchor="start">decompiles it</text>
  <rect class="tile" x="28.0" y="248.0" width="64" height="64" rx="14"/>
  <rect class="icon" x="45" y="269" width="30" height="23" rx="3.5"/>
  <path class="icon" d="M51 277L56 281.5L51 286M59 286H66"/>
  <path class="spark twinkle" d="M74 258l2.2 5.3 5.3 2.2-5.3 2.2-2.2 5.3-2.2-5.3-5.3-2.2 5.3-2.2z"/>
  <text class="name" x="104" y="278" text-anchor="start">Claude Code</text>
  <text class="sub" x="104" y="296" text-anchor="start">reads it, writes Rust</text>
  <rect class="tile" x="28.0" y="358.0" width="64" height="64" rx="14"/>
  <path class="icon" d="M60 375L75 401H45Z" stroke-width="2"/>
  <path class="icon" d="M57 384L65 398" stroke-opacity=".35"/>
  <text class="name" x="104" y="388" text-anchor="start">Rust engine</text>
  <text class="sub" x="104" y="406" text-anchor="start">one for all four games</text>
  <rect class="tile" x="28.0" y="488.0" width="64" height="64" rx="14"/>
  <circle class="glow red halo" cx="60" cy="520" r="10"/>
  <circle class="ring red" cx="60" cy="520" r="10"/>
  <circle class="red" cx="60" cy="520" r="3.5" style="fill: var(--red); stroke: none"/>
  <path class="rays red" d="M75 520L80 520M45 520L40 520M60 535L60 540M60 505L60 500M70.65 530.65L74.2 534.2M49.35 530.65L45.8 534.2M70.65 509.35L74.2 505.8M49.35 509.35L45.8 505.8"/>
  <rect class="tile" x="168.0" y="488.0" width="64" height="64" rx="14"/>
  <circle class="glow blue halo" cx="200" cy="520" r="10"/>
  <circle class="ring blue" cx="200" cy="520" r="10"/>
